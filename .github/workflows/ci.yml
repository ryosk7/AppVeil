name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node bin/appveil.mjs --help
      - name: Reproducible artifact baseline (not AI resistance)
        run: bash scripts/benchmark-local.sh
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-artifact-benchmark
          path: benchmark-results.json
          retention-days: 7
