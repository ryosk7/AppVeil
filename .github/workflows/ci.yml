name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = package.json engines minimum; 24 = current LTS.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
      - run: node bin/appveil.mjs --help
      - name: Install wasm-ld so the Wasm baseline is actually produced
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld
      - name: Reproducible artifact baseline (not AI resistance)
        env:
          # CI must not silently omit the Wasm comparison.
          APPVEIL_REQUIRE_WASM: '1'
        run: bash scripts/benchmark-local.sh
      - name: Backend matrix (correctness gate across JS, VM, Veil Wasm, native, clang Wasm)
        run: |
          node scripts/backend-matrix.mjs > backend-matrix.json
          node -e 'const r=require("./backend-matrix.json"); console.log(JSON.stringify(r.rows.map(x=>[x.backend,x.status,x.nsPerCall??x.reason]))); if (r.rows.some(x=>x.status!=="measured")) process.exit(1);'
      - name: Check every benchmark target is accounted for
        run: |
          node -e 'const r=require("./benchmark-results.json"); const t=r.samples.map(s=>s.type); console.log(JSON.stringify({produced:t,notChecked:r.notChecked})); if(!t.includes("wasm")) process.exit(1);'
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-artifact-benchmark-node${{ matrix.node }}
          path: |
            benchmark-results.json
            backend-matrix.json
          retention-days: 7
