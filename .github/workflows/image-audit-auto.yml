name: Public image audit (snapshot)
# Rerun on scanner changes to check whether first-party source maps embed source bodies.
on:
  push:
    paths:
      - '.github/workflows/image-audit-auto.yml'
      - 'src/inspect.mjs'
      - 'test/embedded-map.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Proofy
            image: ghcr.io/ryosk7/proofy:2.6.18
          - name: Shipboard AI
            image: ghcr.io/ryosk7/shipboardai:0.4.35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pull image
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "$IMAGE"
      - name: Record image digest and inspect contents
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > image-digests.json
          node bin/appveil.mjs inspect-image "$IMAGE" --json > image-audit.json
          node bin/appveil.mjs verify-image-report image-audit.json > image-policy.json || true
          node -e 'const p=require("./image-policy.json"); const f=require("./image-audit.json").findings; console.log(JSON.stringify({pass:p.pass,firstPartyViolations:p.violations.length,allMaps:f.filter(x=>x.rule==="SOURCE_MAP").length,firstPartyEmbeddedSources:f.filter(x=>x.rule==="EMBEDDED_SOURCE_CONTENT").length}));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.name }}
          path: |
            image-digests.json
            image-audit.json
            image-policy.json
          retention-days: 7
          if-no-files-found: warn
